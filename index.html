<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孤鸿组</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'FZLanTingHei', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* 背景微弱光晕 */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(200,200,255,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(200,255,255,0.3) 0%, transparent 50%);
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 25px 30px;
            color: #1a1a1a;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .glass-btn .arrow {
            font-size: 1.2rem;
            color: #ccc;
            transition: transform 0.3s;
        }

        .glass-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.85);
        }

        .glass-btn:active .arrow {
            transform: translateX(5px);
            color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">孤鸿组</div>
    </div>

    <div class="container">
        <a href="work.html" class="glass-btn">
            <h2>作业清单</h2>
            <span class="arrow">→</span>
        </a>
        
        <a href="qa.html" class="glass-btn">
            <h2>作业答案</h2>
            <span class="arrow">→</span>
        </a>
    </div>

</body>
</html>
